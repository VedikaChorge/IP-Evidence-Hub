{% extends "base.html" %}{% block title %}Change password · IP Evidence Hub{% endblock %}{% block content %}<div class="auth-wrap"><form class="panel form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">ACCOUNT · {{ current_user.email }}</div><h1>Change password</h1><label>Current password<input name="current_password" type="password" required autocomplete="current-password"></label><label>New password<input name="new_password" type="password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label><label>Confirm new password<input name="confirm_password" type="password" required minlength="10" autocomplete="new-password"></label><button class="btn full">Update password</button></form></div>{% endblock %}
